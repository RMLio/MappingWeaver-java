stages:
  - lint
  - unittests
  - deploy

include:
  # Make sure the CHANGELOG is always updated
  - project: 'rml/util/ci-templates'
    ref: main
    file: 'CHANGELOG.gitlab-ci.yml'
  # Check Javadoc
  - project: 'rml/util/ci-templates'
    ref: main
    file: 'Javadoc-check.gitlab-ci.yml'
  # Deploy on Maven Central
  - project: 'rml/util/ci-templates'
    ref: main
    file: 'Maven-Central.gitlab-ci.yml'


variables:
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "YourSTRONG!Passw0rd"
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "-s $CI_PROJECT_DIR/.m2/settings.xml --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"


cache:
  key: ${CI_JOB_NAME}
  paths:
    - .m2/repository

# Cancel pipeline if a newer pipeline is running
default:
  interruptible: true

###############################
#                             #
#     Unittests               #
#                             #
###############################

Specification Tests:
  stage: unittests
  image:
    name: maven:3-eclipse-temurin-21
    pull_policy: if-not-present
  services:
    - name: docker:23.0.1-dind
      # explicitly disable tls to avoid docker startup interruption
      command: [ "--tls=false" ]
  variables:
    # Instruct Testcontainers to use the daemon of DinD.
    DOCKER_HOST: "tcp://docker:2375"
    # Instruct Docker not to start over TLS.
    DOCKER_TLS_CERTDIR: ""
    # Improve performance with overlayfs.
    DOCKER_DRIVER: overlay2

  script:
    - 'mvn -Dtest=$TEST test 2>&1 | tee $TEST.log'
  artifacts:
    when: always
    paths:
      - ' $TEST.log'
  parallel:
    matrix:
      - TEST: [
        RMLCoreTest, RMLIOTest, RMLLVTest,
        # implemented and passing (previously commented as "not implemented")
        RMLFNMLTest, RMLSTARTest,
        # logical-view + FNML: source field computed by a function (e.g. toUpperCase(name))
        RMLLVFNMLTest,
        # previously unreferenced (never ran in CI); 10 passing tests
        RMLRegistryTest,
        RMLIOCoreFileTest,
        # RMLCCTest    — RML-CC not implemented: all 35 cases @Disabled/failing (runs 0 tests)
        # RMLIOFNOTest — class @Disabled: "Old RML not supported in MappingLoom-rs" (runs 0 tests)
      ]
  except:
    - main
    - development

Utility Tests:
  stage: unittests
  image:
    name: maven:3-eclipse-temurin-21
    pull_policy: if-not-present
  services:
    - name: docker:23.0.1-dind
      # explicitly disable tls to avoid docker startup interruption
      command: [ "--tls=false" ]
  variables:
    # Instruct Testcontainers to use the daemon of DinD.
    DOCKER_HOST: "tcp://docker:2375"
    # Instruct Docker not to start over TLS.
    DOCKER_TLS_CERTDIR: ""
    # Improve performance with overlayfs.
    DOCKER_DRIVER: overlay2

  script:
    - 'mvn -Dtest=$TEST test 2>&1 | tee $TEST.log'
  artifacts:
    when: always
    paths:
      - ' $TEST.log'
  parallel:
    matrix:
      - TEST: [
                # CLI tests
                CliOutputTest, CliVerbosityTest,
                # file tests
                WebSocketTest, CSVWSourceTest,
                # FnO
                FnOSplitTest, ExternalFunctionTests,
                # Remote
                RMLIOCorePostgreSQLTest,
                # Fixed bugs
                FixedBugsTest, MultipleFunctionExecutionsTest, LogicalViewFieldsTest,
                # Miscellaneous
                ExtendParserTest, MappingPlanTest,
                # omitted — class @Disabled and/or Docker-only, run no tests:
                # CliOutputTest, WebSocketCliTest, KafkaTest, RDBSourceTest
      ]
  except:
    - main
    - development
