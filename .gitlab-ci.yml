stages:
  - lint
  - unittests
  - deploy
  - publish

include:
  # Make sure the CHANGELOG is always updated
  - project: 'rml/util/ci-templates'
    ref: main
    file: 'CHANGELOG.gitlab-ci.yml'
  # Check Javadoc
  - project: 'rml/util/ci-templates'
    ref: main
    file: 'Javadoc-check.gitlab-ci.yml'
  # Deploy on Maven Central
  - project: 'rml/util/ci-templates'
    ref: main
    file: 'Maven-Central.gitlab-ci.yml'


variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "-s $CI_PROJECT_DIR/.m2/settings.xml --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"


cache:
  key: ${CI_JOB_NAME}
  paths:
    - .m2/repository

# Cancel pipeline if a newer pipeline is running
default:
  interruptible: true

###############################
#                             #
#     Unittests               #
#                             #
###############################

.unittests:
  stage: unittests
  image:
    name: maven:3-eclipse-temurin-21
    pull_policy: if-not-present
  script:
    - 'mvn -Dtest=$TEST test 2>&1 | tee $TEST.log'
  artifacts:
    when: always
    paths:
      - '$TEST.log'
  except:
    - main
    - development

# Docker-in-Docker for jobs that use Testcontainers: the Conformance job (its
# database cases), and RMLIOCorePostgreSQLTest or KafkaTest once re-enabled
# (add it to a job's `extends`, after .unittests).
.docker:
  services:
    - name: docker:29-dind
      # explicitly disable tls to avoid docker startup interruption
      command: [ "--tls=false" ]
  variables:
    # Instruct Testcontainers to use the daemon of DinD.
    DOCKER_HOST: "tcp://docker:2375"
    # Instruct Docker not to start over TLS.
    DOCKER_TLS_CERTDIR: ""
    # Improve performance with overlayfs.
    DOCKER_DRIVER: overlay2
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: "YourSTRONG!Passw0rd"

# Each job lists the test classes that run at least one test. A class whose
# tests are all disabled is left out until it is enabled again:
#   RMLCCTest               — RML-CC not implemented, all cases @Disabled
#   RMLIOFNOTest            — class @Disabled: old RML not supported in MappingLoom-rs
#   RMLIOFNOSpecAdaptationsTest — its only test @Disabled
#   RMLIOCoreFileTest       — class @Disabled: old RML not supported in MappingLoom-rs
#   RMLIOCoreMySQLTest      — class @Disabled: old RML not supported in MappingLoom-rs; needs .docker
#   RMLIOCorePostgreSQLTest — class @Disabled; needs .docker
#   KafkaTest               — class @Disabled; needs .docker
#   MappingPlanTest         — class @Disabled
# The spec test classes that read the copies under rml_kgc/spec/ (RMLCoreTest,
# RMLIOTest, RMLLVTest, RMLFNMLTest, RMLSTARTest, RMLRegistryTest) are left out: ModuleTest and the
# Conformance job check what they checked.
Module Tests:
  extends: .unittests
  parallel:
    matrix:
      - TEST:
          # the RML-KGC modules, from merged kg-construct test cases
          - ModuleTest
          # logical-view + FNML: source field computed by a function (e.g. toUpperCase(name))
          - RMLLVFNMLTest

Utility Tests:
  extends: .unittests
  parallel:
    matrix:
      - TEST:
          # CLI tests
          - CliVerbosityTest
          - CliExitCodeTest
          # file tests
          - WebSocketTest
          - CSVWSourceTest
          # FnO
          - FnOSplitTest
          - ExternalFunctionTests
          - ReferenceFunctionTest
          - IriTypeFunctionTest
          # Fixed bugs
          - FixedBugsTest
          - MultipleFunctionExecutionsTest
          - LogicalViewFieldsTest
          # Miscellaneous
          - ExtendParserTest

###############################
#                             #
#     Conformance             #
#                             #
###############################

# The kg-construct conformance suites, run on the jar by mapping-test-runner
# against conformance/expected-results.csv (HANDBOOK: Conformance). Started by
# hand: before each release (RELEASE.md), and for an MR that targets conformance.
Conformance:
  stage: unittests
  extends: .docker
  image:
    name: maven:3-eclipse-temurin-21
    pull_policy: if-not-present
  variables:
    MTR_CACHE: "$CI_PROJECT_DIR/.mtr-cache"
  cache:
    key: conformance
    paths:
      - .m2/repository
      - .mtr-cache
  script:
    - bash conformance/run.sh
  when: manual
  artifacts:
    when: always
    paths:
      - target/conformance/report.json
      - target/conformance/report.md
      - target/conformance/mtr-run/*/*.log
    reports:
      junit: target/conformance/junit.xml

###############################
#                             #
#     Publish JAR artefact    #
#                             #
###############################

Package:
  stage: deploy
  image:
    name: maven:3-eclipse-temurin-21
    pull_policy: if-not-present
  script:
    - 'mvn $MAVEN_CLI_OPTS -DskipTests package'
  artifacts:
    paths:
      - target/MappingWeaver-*.jar

###############################
#                             #
#     Add page with latest    #
#     release                 #
#                             #
###############################

create-pages:
  stage: publish
  image: alpine:latest
  pages:  # specifies that this is a Pages job and publishes the default public directory
    path_prefix: "$CI_COMMIT_BRANCH"
  script:
    - cp target/MappingWeaver-*.jar public/MappingWeaver.jar
